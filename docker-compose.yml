services:
  postgres:
    image: postgres:18-alpine
    container_name: my_iam-postgres
    environment:
      POSTGRES_DB: my_iam
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
      # 初回起動時（volume が空のとき）のみ実行される初期化スクリプト
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8-alpine
    container_name: my_iam-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
