server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/my_iam
    username: user
    password: password
  jooq:
    sql-dialect: POSTGRES
  data:
    redis:
      host: localhost
      port: 16379
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema: common
        # DDL は docker/postgres/init/01_schema.sql で管理するため無効化
        # ※有効のままだと初期化後に SET search_path TO user が実行され、user が予約語のため構文エラーになる
        schema-initialization:
          enabled: false
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080

logging:
  level:
    root: INFO
    com.myiam: DEBUG
  pattern:
    correlation: "[%X{traceId:-}] [%X{spanId:-}] "

jwt:
  key:
    rotation:
      cron: "0 0 1 1 * *"
    ttl: P35D

app:
  security:
    login-path: "/login"
    lockout:
      max-attempts: 5
      window: PT15M
  cache:
    auth:
      specs:
        jwk: "expireAfterWrite=10m"
        registered_client: "expireAfterWrite=10m,maximumSize=100"
        registered_client_id_map: "expireAfterWrite=10m,maximumSize=9999"
        user_claims: "expireAfterWrite=15m"
        subject_permissions: "expireAfterWrite=10m"

#ToDo: テスト用と敏感情報などを別ファイルに移動する（ビルド流れ調整合わせて）
management:
  tracing:
    sampling:
      probability: 0.0
  endpoints:
    web:
      exposure:
        include: beans,conditions