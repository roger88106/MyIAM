<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>エラー画面 (Thymeleaf 骨格サンプル)</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .error-box {
            background-color: #ffffff;
            border: 1px solid #dc3545;
            border-radius: 8px;
            padding: 30px;
            width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .error-code {
            color: #dc3545;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .error-msg {
            color: #6c757d;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin: 5px;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="error-box">
    <h2>エラーが発生しました</h2>

    <!-- 
        【Thymeleaf 機能展示 ①: th:text】
        テキスト出力: Controller から Model に渡された error.errorCode の値を安全にテキスト出力する
    -->
    <div class="error-code" th:text="${error != null ? error.errorCode : 'OAuth2 Error'}">
        Status 500
    </div>

    <!-- 
        【Thymeleaf 機能展示 ②: th:text】
        テキスト出力: Controller から Model に渡された error.description の値を安全にテキスト出力する
    -->
    <div class="error-msg" th:text="${error != null ? error.description : '予期しないエラーが発生しました。'}">
        エラーの具体的な原因がここに表示されます。
    </div>

    <div class="action-area">
        <!-- 
            【Thymeleaf 機能展示 ③: th:if】
            条件分岐: Model 内に clientId が存在し、空でない場合にのみこのリダイレクトボタンをレンダリングする
        -->
        <div th:if="${clientId != null && !clientId.isEmpty()}">
            <!-- 
                【Thymeleaf 機能展示 ④: th:href とパラメータ付き URL 生成】
                URL生成: パラメータ付きの URL（例: /?client_id=xxx）をコンテキストパスを考慮して動的に生成する
            -->
            <a th:href="@{/(client_id=${clientId})}" class="btn btn-primary">
                クライアントに戻る
            </a>
        </div>

        <!-- 
            【Thymeleaf 機能展示 ⑤: th:href】
            シンプルなページ遷移リンクの生成
        -->
        <a th:href="@{/login}" class="btn btn-secondary">
            ログイン画面へ
        </a>
    </div>
</div>

</body>
</html>
