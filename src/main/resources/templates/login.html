<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyIAM ログイン</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --border: #e2e6ea;
            --text: #1f2933;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error-bg: #fdecee;
            --error-border: #f5c2c7;
            --error-text: #b02a37;
            --success-bg: #e6f4ea;
            --success-border: #b7dfc3;
            --success-text: #1e7e46;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card: #1e293b;
                --border: #334155;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --primary: #3b82f6;
                --primary-hover: #2563eb;
                --error-bg: #3f1d22;
                --error-border: #7f2933;
                --error-text: #fca5a5;
                --success-bg: #16301f;
                --success-border: #2f5c3d;
                --success-text: #86efac;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .login-card h1 {
            font-size: 1.4rem;
            margin: 0 0 4px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.875rem;
            margin: 0 0 24px;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        .alert-error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
        }

        .alert-success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .field { margin-bottom: 16px; }

        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--muted);
        }

        .field input {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.95rem;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .field input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 11px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
<div class="login-card">
    <h1>MyIAM</h1>
    <p class="subtitle">アカウントにログイン</p>

    <!--
        認証失敗メッセージ。
        controller が session の認証例外を i18n キーに変換し、errorMessage として渡す。
          messages.properties 整備後は th:text="#{${errorMessage}}" に差し替える。
    -->
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">
        ログインに失敗しました。
    </div>

    <!-- ログアウト成功メッセージ -->
    <div th:if="${param.logout}" class="alert alert-success">
        ログアウトしました。
    </div>

    <!--
        Post-Redirect-Get の POST 先。ここへ POST すると controller ではなく
        Spring Security の認証フィルターが処理する。
    -->
    <form th:action="@{/login}" method="post">

        <!-- CSRF トークン（未挿入だと POST が 403 になる） -->
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <!-- ログイン ID は email。ただし Spring 既定のパラメータ名 username を使用 -->
            <label for="username">メールアドレス</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username"/>
        </div>

        <div class="field">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"/>
        </div>

        <button type="submit" class="btn">ログイン</button>
    </form>
</div>
</body>
</html>
